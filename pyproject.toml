[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gigalearn-autotrainer"
version = "0.1.0"
description = "Autonomous curriculum brain for GigaLearnRL"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "wandb>=0.16.0",
    "openai>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["autotrainer*"]
